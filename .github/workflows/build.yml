name: Microservices CI/CD Pipeline
on:
  push:
    branches: [ "dev", "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build & conditionally push to Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      # 1. Compile the code (Runs on ALL branches to catch errors early)
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean install -DskipTests

      # 2. Log in (ONLY runs on main)
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Your beautiful loop! (ONLY runs on main)
      - name: Build and Push Docker Images
        if: github.ref == 'refs/heads/main'
        run: |
          SERVICES=("discovery-server" "config-server" "api-gateway" "identity-service" "job-service" "application-service")

          for SERVICE in "${SERVICES[@]}"
          do
            echo "========================================="
            echo " Building $SERVICE..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/$SERVICE:latest ./$SERVICE
          
            echo " Pushing $SERVICE..."
            docker push ${{ secrets.DOCKER_USERNAME }}/$SERVICE:latest
          done