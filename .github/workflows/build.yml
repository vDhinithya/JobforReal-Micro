name: Microservices CI/CD Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (WITH tests)
        run: |
          chmod +x mvnw
          ./mvnw clean install

  docker-build-push:
    name: Build & Push Docker Images
    needs: build-test
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Images
        run: |
          SERVICES=("discovery-server" "config-server" "api-gateway" "identity-service" "job-service" "application-service")

          for SERVICE in "${SERVICES[@]}"
          do
            echo "Building $SERVICE..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/$SERVICE:latest ./$SERVICE
          
            echo "Pushing $SERVICE..."
            docker push ${{ secrets.DOCKER_USERNAME }}/$SERVICE:latest
          done